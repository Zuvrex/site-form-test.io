<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Создать объявление</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Создать объявление</h1>

    <label>Блок чекбоксов</label>
    <div class="check-grid">
      <label><input type="checkbox" name="section1" value="чекбокс1"> чекбокс1</label>
      <label><input type="checkbox" name="section1" value="чекбокс2"> чекбокс2</label>
      <label><input type="checkbox" name="section1" value="чекбокс3"> чекбокс3</label>
    </div>

    <label for="title">Заголовок</label>
    <input id="title" maxlength="50" placeholder="Например: Ищу друга">

    <label for="description">Описание</label>
    <textarea id="description" maxlength="1500" placeholder="Возраст, город, интересы..."></textarea>

    <label for="photos">Фотографии</label>
    <input type="file" id="photos" accept="image/jpeg,image/png,image/gif" multiple>
    <p class="hint">До 3 файлов, каждый до 5 МБ.</p>

    <details>
      <summary>Дополнительные параметры</summary>
      <div class="row">
        <input id="my_age" type="number" min="18" placeholder="Мой возраст">
        <input id="my_height" type="number" placeholder="Рост">
        <input id="my_weight" type="number" placeholder="Вес">
      </div>
      <div class="row">
        <input id="pref_age_from" type="number" min="18" placeholder="Возраст от">
        <input id="pref_age_to" type="number" min="18" placeholder="Возраст до">
      </div>
      <div class="row">
        <input id="pref_height_from" type="number" placeholder="Рост от">
        <input id="pref_height_to" type="number" placeholder="Рост до">
      </div>
      <div class="row">
        <input id="pref_weight_from" type="number" placeholder="Вес от">
        <input id="pref_weight_to" type="number" placeholder="Вес до">
      </div>
    </details>

    <label for="tags">Теги</label>
    <input id="tags" placeholder="спорт, музыка, прогулки">

    <p id="error" class="error"></p>
    <button id="submitBtn" type="button">Сохранить и опубликовать</button>
  </main>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const params = new URLSearchParams(location.search);
    const fbUrl = params.get("fb");
    const userIdFromUrl = params.get("user_id");
    const userId = tg.initDataUnsafe?.user?.id || userIdFromUrl;
    const submitBtn = document.getElementById("submitBtn");
    const errorEl = document.getElementById("error");

    function showError(text) {
      errorEl.textContent = text;
      errorEl.style.display = "block";
    }

    function makeToken() {
      const random = Math.random().toString(36).slice(2);
      return `${Date.now().toString(36)}_${random}`;
    }

    async function uploadPhotos(files) {
      const urls = [];
      for (const file of files) {
        if (file.size > 5 * 1024 * 1024) {
          throw new Error(`Файл ${file.name} больше 5 МБ`);
        }
        const form = new FormData();
        form.append("reqtype", "fileupload");
        form.append("time", "72h");
        form.append("fileToUpload", file);
        const response = await fetch("https://litterbox.catbox.moe/resources/internals/api.php", {
          method: "POST",
          body: form
        });
        if (!response.ok) throw new Error("Не удалось загрузить фото");
        const url = (await response.text()).trim();
        if (url.startsWith("http")) urls.push(url);
      }
      return urls;
    }

    async function submitForm() {
      errorEl.style.display = "none";

      if (!fbUrl || !userId) {
        showError("Форма должна быть открыта из Telegram.");
        return;
      }

      const section1 = Array.from(document.querySelectorAll("input[name='section1']:checked")).map((item) => item.value);
      const description = document.getElementById("description").value.trim();
      const files = Array.from(document.getElementById("photos").files);

      if (section1.length === 0) {
        showError("Выбери хотя бы один чекбокс.");
        return;
      }
      if (!description) {
        showError("Заполни описание.");
        return;
      }
      if (files.length > 3) {
        showError("Можно прикрепить не больше 3 фото.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Сохраняю...";

      try {
        const token = makeToken();
        const photos = await uploadPhotos(files);
        const tags = document.getElementById("tags").value
          .split(",")
          .map((tag) => tag.trim())
          .filter(Boolean)
          .slice(0, 3);

        const payload = {
          user_id: Number(userId),
          title: document.getElementById("title").value.trim(),
          description,
          section1,
          tags,
          photos,
          my_params: {
            age: document.getElementById("my_age").value,
            height: document.getElementById("my_height").value,
            weight: document.getElementById("my_weight").value
          },
          my_prefs: {
            age_from: document.getElementById("pref_age_from").value,
            age_to: document.getElementById("pref_age_to").value,
            height_from: document.getElementById("pref_height_from").value,
            height_to: document.getElementById("pref_height_to").value,
            weight_from: document.getElementById("pref_weight_from").value,
            weight_to: document.getElementById("pref_weight_to").value
          }
        };

        await fetch(`${fbUrl}/inline_submissions/${token}.json`, {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });

        tg.switchInlineQuery(`publish:${token}`);
      } catch (error) {
        showError(error.message || "Не удалось сохранить объявление.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Сохранить и опубликовать";
      }
    }

    submitBtn.addEventListener("click", submitForm);
  </script>
</body>
</html>
