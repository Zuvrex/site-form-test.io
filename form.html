<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание объявления</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 15px;
            margin: 0;
        }
        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
        }
        textarea {
            height: 120px;
            resize: none;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .hint {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>
    <h2>Опишите себя</h2>
    <input type="text" id="title" placeholder="Заголовок анкеты (например: Ищу друга)" maxlength="100">
    
    <input type="file" id="photos" accept="image/*" multiple>
    <span class="hint">Можно прикрепить до 3-х фотографий</span>
    
    <textarea id="description" placeholder="Ваш возраст, город, интересы и т.д..."></textarea>
    
    <button id="submitBtn" onclick="sendForm()">Сохранить объявление</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function sendForm() {
            const title = document.getElementById('title').value.trim();
            const desc = document.getElementById('description').value.trim();
            const fileInput = document.getElementById('photos');
            const btn = document.getElementById('submitBtn');

            if (!title || !desc) {
                tg.showAlert("Пожалуйста, заполните заголовок и описание.");
                return;
            }

            if (fileInput.files.length > 3) {
                tg.showAlert("Можно прикрепить не более 3-х фотографий.");
                return;
            }

            // Блокируем кнопку на время загрузки
            btn.disabled = true;
            btn.innerText = "Загрузка фото и создание анкеты...";

            let photoUrls = [];

            // Если пользователь выбрал файлы, загружаем их в Telegraph
            if (fileInput.files.length > 0) {
                const formData = new FormData();
                for (let i = 0; i < fileInput.files.length; i++) {
                    formData.append('file', fileInput.files[i]);
                }

                try {
                    const response = await fetch('https://telegra.ph/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    // Извлекаем адреса (src) загруженных картинок
                    photoUrls = data.map(item => item.src);
                } catch (e) {
                    tg.showAlert("Ошибка при загрузке фото. Попробуйте загрузить другие картинки или меньший размер.");
                    btn.disabled = false;
                    btn.innerText = "Сохранить объявление";
                    return;
                }
            }

            // Формируем JSON с данными
            const payload = {
                title: title,
                description: desc,
                photos: photoUrls
            };

            // Отправляем JSON боту и закрываем окно
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
