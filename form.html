<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание объявления</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="section-title">Основное</div>
    <label class="field-label">Блок чекбоксов <span style="color:#ff4d4d">*</span></label>
    <div class="checkbox-group">
        <label><input type="checkbox" name="section1" value="чекбокс1" id="cb1"> чекбокс1</label>
        <label><input type="checkbox" name="section1" value="чекбокс2" id="cb2"> чекбокс2</label>
        <label><input type="checkbox" name="section1" value="чекбокс3" id="cb3"> чекбокс3</label>
    </div>
    <div id="section1Error" class="error-text" style="text-align: left; margin-top: 5px;">Пожалуйста, выберите хотя бы один вариант.</div>

    <label for="title" class="field-label" style="margin-top: 25px;">Заголовок анкеты <span class="optional">(необязательно)</span></label>
    <input type="text" id="title" placeholder="Например: Ищу друга">
    <div id="titleCounter" class="counter">0/50</div>

    <label for="description" class="field-label">Описание <span style="color:#ff4d4d">*</span></label>
    <textarea id="description" placeholder="Ваш возраст, город, интересы и т.д..."></textarea>
    <div id="descCounter" class="counter">0/1500</div>

    <label for="photos" class="field-label">Фотографии <span class="optional">(необязательно)</span></label>
    <input type="file" id="photos" accept="image/jpeg, image/png, image/gif" multiple>
    <span class="hint">Можно прикрепить до 3-х фотографий (каждая до 5 МБ)</span>

    <details style="margin-top: 25px;">
        <summary class="section-title" style="cursor: pointer; user-select: none; margin-top: 0;">Дополнительные параметры <span class="optional">(необязательно)</span></summary>
        
        <div class="sub-section-title">Мои параметры</div>
    <div class="inline-field">
        <label for="my_age">Возраст:</label>
        <input type="number" id="my_age" min="18">
        <span>лет</span>
    </div>
    <div class="inline-field">
        <label for="my_height">Рост:</label>
        <input type="number" id="my_height">
        <span>см</span>
    </div>
    <div class="inline-field">
        <label for="my_weight">Вес:</label>
        <input type="number" id="my_weight">
        <span>кг</span>
    </div>
    <div class="inline-field">
        <label for="my_list1">список 1:</label>
        <select id="my_list1">
            <option value="не важно" selected>Не важно</option>
            <option value="положительное">Положительное</option>
            <option value="отрицательное">Отрицательное</option>
            <option value="нейтральное">Нейтральное</option>
        </select>
    </div>

        <div class="sub-section-title">Мои предпочтения</div>
    <div class="inline-field">
        <label>Возраст:</label>
        <input type="number" id="pref_age_from" min="18" placeholder="От">
        <span>-</span>
        <input type="number" id="pref_age_to" min="18" placeholder="До">
        <span>лет</span>
    </div>
    <div class="inline-field">
        <label>Рост:</label>
        <input type="number" id="pref_height_from" placeholder="От">
        <span>-</span>
        <input type="number" id="pref_height_to" placeholder="До">
        <span>см</span>
    </div>
    <div class="inline-field">
        <label>Вес:</label>
        <input type="number" id="pref_weight_from" placeholder="От">
        <span>-</span>
        <input type="number" id="pref_weight_to" placeholder="До">
        <span>кг</span>
    </div>
    <div class="inline-field">
        <label for="pref_list2">список 2:</label>
        <select id="pref_list2">
            <option value="не важно" selected>Не важно</option>
        <option value="положительное">Положительное</option>
        <option value="отрицательное">Отрицательное</option>
        <option value="нейтральное">Нейтральное</option>
    </select>
    </div>

    <div class="sub-section-title">Теги <span class="optional">(до 3-х)</span></div>
    <div class="tags-container" id="tagsContainer">
        <div style="text-align: center; color: gray; padding: 10px;">Загрузка тегов...</div>
    </div>
    </details>

    <div id="formError" class="error-text" style="text-align: center; font-size: 15px;"></div>
    <button id="submitBtn" onclick="sendForm()">Сохранить объявление</button>
</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Читаем параметры из URL (если форма открыта для редактирования)
        const params = new URLSearchParams(window.location.search);
        const editMsgId = params.get('edit_msg_id');
        const createMsgId = params.get('create_msg_id');
        const formDataStr = params.get('form_data');
        const fbUrl = params.get('fb');

        let initialData = null;
        if (formDataStr) {
            try {
                initialData = JSON.parse(decodeURIComponent(formDataStr));
            } catch (e) {
                console.error("Ошибка парсинга form_data", e);
            }
        }

        const titleInput = document.getElementById('title');
        const descInput = document.getElementById('description');
        const titleCounter = document.getElementById('titleCounter');
        const descCounter = document.getElementById('descCounter');
        const errorText = document.getElementById('formError');

        function updateCounters() {
            const titleLen = titleInput.value.length;
            const descLen = descInput.value.length;
            
            titleCounter.innerText = `${titleLen}/50`;
            if (titleLen > 50) {
                titleCounter.classList.add('limit-exceeded');
                titleInput.classList.add('error-border');
            } else {
                titleCounter.classList.remove('limit-exceeded');
                titleInput.classList.remove('error-border');
            }
            
            descCounter.innerText = `${descLen}/1500`;
            if (descLen > 1500) {
                descCounter.classList.add('limit-exceeded');
                descInput.classList.add('error-border');
            } else {
                descCounter.classList.remove('limit-exceeded');
                descInput.classList.remove('error-border');
            }
        }

        titleInput.addEventListener('input', updateCounters);
        descInput.addEventListener('input', updateCounters);
        
        // Мгновенная валидация для "Раздел 1"
        const section1Checkboxes = document.querySelectorAll('input[name="section1"]');
        const section1Error = document.getElementById('section1Error');
        function validateSection1() {
            const checkedCount = document.querySelectorAll('input[name="section1"]:checked').length;
            if (checkedCount === 0) {
                section1Error.style.display = 'block';
            } else {
                section1Error.style.display = 'none';
            }
        }
        section1Checkboxes.forEach(cb => cb.addEventListener('change', validateSection1));


        // Валидация возраста на лету
        const ageInputs = ['my_age', 'pref_age_from', 'pref_age_to'];
        ageInputs.forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('input', () => {
                if (el.value && parseInt(el.value) < 18) el.classList.add('error-border');
                else el.classList.remove('error-border');
            });
        });

        let selectedTags = [];
        
        // Загрузка тегов из файла
        async function loadTags() {
            try {
                const response = await fetch('hashtags.txt');
                const text = await response.text();
                const container = document.getElementById('tagsContainer');
                container.innerHTML = '';
                
                let currentHtml = '';
                const lines = text.split('\n');
                
                lines.forEach(line => {
                    const t = line.trim();
                    if (!t) return;
                    if (t.startsWith('*') && t.endsWith('*')) {
                        currentHtml += `<div class="tag-category">${t.slice(1, -1)}</div>`;
                    } else {
                        const isSelected = initialData?.tags?.includes(t) ? 'selected' : '';
                        if(isSelected) selectedTags.push(t);
                        currentHtml += `<div class="tag-chip ${isSelected}" onclick="toggleTag(this, '${t}')">#${t}</div>`;
                    }
                });
                container.innerHTML = currentHtml;
            } catch (e) {
                document.getElementById('tagsContainer').innerHTML = '<div style="color:red; padding:10px;">Ошибка загрузки тегов</div>';
            }
        }

        window.toggleTag = function(element, tag) {
            if (selectedTags.includes(tag)) {
                selectedTags = selectedTags.filter(t => t !== tag);
                element.classList.remove('selected');
            } else {
                if (selectedTags.length >= 3) {
                    tg.showAlert("Можно выбрать не более 3-х тегов.");
                    return;
                }
                selectedTags.push(tag);
                element.classList.add('selected');
            }
        }

        // Предзаполнение формы
        if (initialData) {
            if (initialData.title) titleInput.value = initialData.title;
            if (initialData.description) descInput.value = initialData.description;
            
            if (initialData.section1) {
                ['cb1', 'cb2', 'cb3'].forEach((id, idx) => {
                    const val = ['чекбокс1', 'чекбокс2', 'чекбокс3'][idx];
                    document.getElementById(id).checked = initialData.section1.includes(val);
                });
            }
            
            if(initialData.my_params) {
                if(initialData.my_params.age) document.getElementById('my_age').value = initialData.my_params.age;
                if(initialData.my_params.height) document.getElementById('my_height').value = initialData.my_params.height;
                if(initialData.my_params.weight) document.getElementById('my_weight').value = initialData.my_params.weight;
                if(initialData.my_params.list1) document.getElementById('my_list1').value = initialData.my_params.list1;
            }
            
            if(initialData.my_prefs) {
                if(initialData.my_prefs.age_from) document.getElementById('pref_age_from').value = initialData.my_prefs.age_from;
                if(initialData.my_prefs.age_to) document.getElementById('pref_age_to').value = initialData.my_prefs.age_to;
                if(initialData.my_prefs.height_from) document.getElementById('pref_height_from').value = initialData.my_prefs.height_from;
                if(initialData.my_prefs.height_to) document.getElementById('pref_height_to').value = initialData.my_prefs.height_to;
                if(initialData.my_prefs.weight_from) document.getElementById('pref_weight_from').value = initialData.my_prefs.weight_from;
                if(initialData.my_prefs.weight_to) document.getElementById('pref_weight_to').value = initialData.my_prefs.weight_to;
                if(initialData.my_prefs.list2) document.getElementById('pref_list2').value = initialData.my_prefs.list2;
            }
        } else {
            // По умолчанию выбираем все 3 чекбокса для Раздела 1 для новых пользователей
            document.getElementById('cb1').checked = true;
            document.getElementById('cb2').checked = true;
            document.getElementById('cb3').checked = true;
        }

        loadTags();
        updateCounters();

        async function sendForm() {
            let title = titleInput.value.trim();
            const desc = document.getElementById('description').value.trim();
            const fileInput = document.getElementById('photos');
            const userId = tg.initDataUnsafe?.user?.id;
            
            const section1 = Array.from(document.querySelectorAll('input[name="section1"]:checked')).map(cb => cb.value);

            errorText.style.display = 'none';
            let hasError = false;
            let errorMsg = "";
            
            // Проверка возраста
            const age1 = document.getElementById('my_age').value;
            const age2 = document.getElementById('pref_age_from').value;
            const age3 = document.getElementById('pref_age_to').value;
            if ((age1 && parseInt(age1) < 18) || (age2 && parseInt(age2) < 18) || (age3 && parseInt(age3) < 18)) {
                hasError = true;
                errorMsg = "Минимальный допустимый возраст — 18 лет.";
            }

            if (!userId || !fbUrl) {
                errorMsg = "Ошибка авторизации. Убедитесь, что открыли форму через Telegram.";
                hasError = true;
            } else if (section1.length === 0) {
                errorMsg = "Пожалуйста, выберите хотя бы один вариант в блоке чекбоксов.";
                validateSection1(); // Показываем ошибку под полем
                hasError = true;
            } else if (!desc) {
                descInput.classList.add('error-border');
                errorMsg = "Пожалуйста, заполните обязательное поле 'Описание анкеты'.";
                hasError = true;
            } else if (titleInput.value.length > 50) {
                titleInput.classList.add('error-border');
                errorMsg = "Длина заголовка не должна превышать 50 символов.";
                hasError = true;
            } else if (descInput.value.length > 1500) {
                descInput.classList.add('error-border');
                errorMsg = "Длина описания не должна превышать 1500 символов.";
                hasError = true;
            }

            if (hasError) {
                errorText.innerText = errorMsg;
                errorText.style.display = 'block';
                return;
            }

            if (fileInput.files.length > 3) {
                tg.showAlert("Можно прикрепить не более 3-х фотографий.");
                return;
            }

            for (let i = 0; i < fileInput.files.length; i++) {
                if (fileInput.files[i].size > 5 * 1024 * 1024) {
                    tg.showAlert(`Файл "${fileInput.files[i].name}" слишком большой. Максимальный размер — 5 МБ.`);
                    return;
                }
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Загрузка фото и создание анкеты...";

            let photoUrls = [];

            // Загружаем выбранные файлы напрямую на Litterbox (Catbox)
            if (fileInput.files.length > 0) {
                try {
                    const uploadPromises = Array.from(fileInput.files).map(async (file) => {
                        const formData = new FormData();
                        formData.append('reqtype', 'fileupload');
                        formData.append('time', '72h'); // Удаление через 72 часа
                        formData.append('fileToUpload', file);

                        const response = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
                            method: 'POST',
                            body: formData
                        });
                        
                        if (!response.ok) throw new Error("Network error");
                        return await response.text();
                    });
                    
                    const results = await Promise.all(uploadPromises);
                    photoUrls = results.filter(url => url.startsWith('http')).map(url => url.trim());
                } catch (e) {
                    console.error("Ошибка загрузки:", e);
                    tg.showAlert("Ошибка при загрузке фото на сервер.");
                    btn.disabled = false;
                    btn.innerText = "Сохранить объявление";
                    return;
                }
            }

            const payload = {
                title: title,
                description: desc,
                section1: section1,
                my_params: {
                    age: document.getElementById('my_age').value,
                    height: document.getElementById('my_height').value,
                    weight: document.getElementById('my_weight').value,
                    list1: document.getElementById('my_list1').value
                },
                my_prefs: {
                    age_from: document.getElementById('pref_age_from').value,
                    age_to: document.getElementById('pref_age_to').value,
                    height_from: document.getElementById('pref_height_from').value,
                    height_to: document.getElementById('pref_height_to').value,
                    weight_from: document.getElementById('pref_weight_from').value,
                    weight_to: document.getElementById('pref_weight_to').value,
                    list2: document.getElementById('pref_list2').value
                },
                tags: selectedTags,
                photos: photoUrls,
                user_id: userId
            };

            // Если это редактирование, передаем ID редактируемого сообщения обратно боту
            if (editMsgId) {
                payload.edit_msg_id = parseInt(editMsgId);
            }
            if (createMsgId) {
                payload.create_msg_id = parseInt(createMsgId);
            }

            try {
                await fetch(`${fbUrl}/submissions.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                tg.close(); // Мгновенно закрываем форму после отправки
            } catch (e) {
                console.error("Ошибка сохранения в базу:", e);
                tg.showAlert("Не удалось отправить данные на сервер.");
                btn.disabled = false;
                btn.innerText = "💾 Сохранить анкету";
            }
        }
    </script>
</body>
</html>
