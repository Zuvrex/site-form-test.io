<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание объявления</title>
    <!-- Подключаем библиотеку Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Динамические цвета темы Telegram */
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 15px;
            margin: 0;
        }
        textarea {
            width: 100%;
            height: 150px;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            resize: none;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Опишите себя</h2>
    <textarea id="description" placeholder="Введите текст вашей анкеты..."></textarea>
    <button onclick="sendForm()">Сохранить объявление</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Открываем форму на весь экран

        function sendForm() {
            const desc = document.getElementById('description').value.trim();
            
            if (desc === "") {
                tg.showAlert("Пожалуйста, заполните описание.");
                return;
            }

            // Метод sendData закрывает Web App и отправляет строку боту 
            // в виде события web_app_data
            tg.sendData(desc);
        }
    </script>
</body>
</html>
