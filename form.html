<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание объявления</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 15px;
            margin: 0;
        }
        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
        }
        textarea {
            height: 150px;
            resize: none;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .hint {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>
    <h2>Описание анкеты</h2>
    
    <input type="text" id="title" placeholder="Заголовок анкеты (например: Ищу друга)" maxlength="50">
    <textarea id="description" placeholder="Ваш возраст, город, интересы и т.д..." maxlength="5000"></textarea>
    
    <input type="file" id="photos" accept="image/jpeg, image/png, image/gif" multiple>
    <span class="hint">Можно прикрепить до 3-х фотографий (каждая до 5 МБ)</span>

    <button id="submitBtn" onclick="sendForm()">Сохранить объявление</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Читаем параметры из URL (если форма открыта для редактирования)
        const params = new URLSearchParams(window.location.search);
        const editMsgId = params.get('edit_msg_id');
        const initialTitle = params.get('title');
        const initialDesc = params.get('desc');

        // Предзаполняем поля старыми значениями, если они переданы ботом
        if (initialTitle) document.getElementById('title').value = initialTitle;
        if (initialDesc) document.getElementById('description').value = initialDesc;

        async function sendForm() {
            const title = document.getElementById('title').value.trim();
            const desc = document.getElementById('description').value.trim();
            const fileInput = document.getElementById('photos');

            if (!title || !desc) {
                tg.showAlert("Пожалуйста, заполните заголовок и описание.");
                return;
            }

            if (fileInput.files.length > 3) {
                tg.showAlert("Можно прикрепить не более 3-х фотографий.");
                return;
            }

            for (let i = 0; i < fileInput.files.length; i++) {
                if (fileInput.files[i].size > 5 * 1024 * 1024) {
                    tg.showAlert(`Файл "${fileInput.files[i].name}" слишком большой. Максимальный размер — 5 МБ.`);
                    return;
                }
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Загрузка фото и создание анкеты...";

            let photoUrls = [];

            // Загружаем выбранные файлы напрямую на Litterbox (Catbox)
            if (fileInput.files.length > 0) {
                try {
                    for (let i = 0; i < fileInput.files.length; i++) {
                        const formData = new FormData();
                        formData.append('reqtype', 'fileupload');
                        formData.append('time', '72h'); // Удаление через 72 часа
                        formData.append('fileToUpload', fileInput.files[i]);

                        const response = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
                            method: 'POST',
                            body: formData
                        });
                        
                        if (!response.ok) throw new Error("Network error");
                        const url = await response.text();
                        if (url.startsWith('http')) photoUrls.push(url.trim());
                    }
                } catch (e) {
                    console.error("Ошибка загрузки:", e);
                    tg.showAlert("Ошибка при загрузке фото на сервер.");
                    btn.disabled = false;
                    btn.innerText = "Сохранить объявление";
                    return;
                }
            }

            const payload = {
                title: title,
                description: desc,
                photos: photoUrls
            };

            // Если это редактирование, передаем ID редактируемого сообщения обратно боту
            if (editMsgId) {
                payload.edit_msg_id = parseInt(editMsgId);
            }

            // Отправляем JSON боту (только текст) и закрываем окно
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
