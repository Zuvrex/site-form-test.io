<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание объявления</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 15px;
            margin: 0;
        }
        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
        }
        textarea {
            height: 150px;
            resize: none;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Описание анкеты</h2>
    
    <input type="text" id="title" placeholder="Заголовок анкеты (например: Ищу друга)" maxlength="100">
    <textarea id="description" placeholder="Ваш возраст, город, интересы и т.д..."></textarea>
    
    <button id="submitBtn" onclick="sendForm()">Далее (добавить фото)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Читаем параметры из URL (если форма открыта для редактирования)
        const params = new URLSearchParams(window.location.search);
        const initialTitle = params.get('title');
        const initialDesc = params.get('desc');

        // Предзаполняем поля старыми значениями, если они переданы ботом
        if (initialTitle) document.getElementById('title').value = initialTitle;
        if (initialDesc) document.getElementById('description').value = initialDesc;

        function sendForm() {
            const title = document.getElementById('title').value.trim();
            const desc = document.getElementById('description').value.trim();

            if (!title || !desc) {
                tg.showAlert("Пожалуйста, заполните заголовок и описание.");
                return;
            }

            const payload = {
                title: title,
                description: desc
            };

            // Отправляем JSON боту (только текст) и закрываем окно
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
